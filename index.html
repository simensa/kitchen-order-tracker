  <script type="module">
    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      push,
      onValue,
      remove,
      runTransaction
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

    // =========================
    // FIREBASE
    // =========================

    const firebaseConfig = {
      apiKey:
        "AIzaSyAuxTOa79Q53VQ9-hFPVrbaopcUmb-k618",

      authDomain:
        "kitchen-tracker-6563e.firebaseapp.com",

      databaseURL:
        "https://kitchen-tracker-6563e-default-rtdb.europe-west1.firebasedatabase.app",

      projectId:
        "kitchen-tracker-6563e",

      storageBucket:
        "kitchen-tracker-6563e.firebasestorage.app",

      messagingSenderId:
        "910563195014",

      appId:
        "1:910563195014:web:7c826936ec28edfa273907"
    };

    const app =
      initializeApp(firebaseConfig);

    const db =
      getDatabase(app);

    const ordersRef =
      ref(db, 'orders');

    const botStatusRef =
      ref(db, 'botStatus');

    // =========================
    // DOM REFERENCES
    // =========================

    const addBtn =
      document.getElementById(
        'addBtn'
      );

    const ordersContainer =
      document.getElementById(
        'ordersContainer'
      );

    const summaryContainer =
      document.getElementById(
        'summary'
      );

    const botStatusContainer =
      document.getElementById(
        'botStatusContainer'
      );

    // =========================
    // CONSTANTS
    // =========================

    const KITCHEN_ITEMS = [
      'Boneless',
      'Half Boneless',
      '8 Wings',
      '4 Wings',
      'Beef bulgogi',
      'Jeyuk',
      'Bibimbap',
      'Bulgogi Japche',
      'Japche'
    ];

    const SOURCE_LABELS = {
      foodora: 'Foodora',
      wolt: 'Wolt',
      munu: 'Munu',
      manual: 'Manual'
    };

    const SOURCE_BADGE_CLASSES = {
      foodora:
        'bg-pink-100 text-pink-800',

      wolt:
        'bg-blue-100 text-blue-800',

      munu:
        'bg-purple-100 text-purple-800',

      manual:
        'bg-gray-200 text-gray-800'
    };

    const BOT_DISPLAY_ORDER = [
      'foodora',
      'wolt',
      'munu'
    ];

    const BOT_ONLINE_MAX_AGE_MS =
      60 * 1000;

    const BOT_DELAYED_MAX_AGE_MS =
      120 * 1000;

    let latestBotStatusData = {};

    // =========================
    // GENERAL HELPERS
    // =========================

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function getOrderSource(order) {
      return String(
        order.source ||
        order.platform ||
        'manual'
      ).toLowerCase();
    }

    function getSourceLabel(source) {
      return (
        SOURCE_LABELS[source] ||
        source ||
        'Unknown'
      );
    }

    function getSourceBadgeClass(source) {
      return (
        SOURCE_BADGE_CLASSES[source] ||
        'bg-gray-200 text-gray-800'
      );
    }

    function getOrderNumber(order) {
      return (
        order.orderNumber ||
        order.externalOrderId ||
        order.orderId ||
        null
      );
    }

    function formatReadyTime(readyAt) {
      const milliseconds =
        Number(readyAt);

      if (
        !Number.isFinite(milliseconds) ||
        milliseconds <= 0
      ) {
        return 'Unknown time';
      }

      return new Date(
        milliseconds
      ).toLocaleTimeString(
        'no-NO',
        {
          timeZone:
            'Europe/Oslo',

          hour:
            '2-digit',

          minute:
            '2-digit'
        }
      );
    }

    function formatDateTime(milliseconds) {
      const value =
        Number(milliseconds);

      if (
        !Number.isFinite(value) ||
        value <= 0
      ) {
        return 'Unknown';
      }

      return new Date(
        value
      ).toLocaleString(
        'no-NO',
        {
          timeZone:
            'Europe/Oslo',

          day:
            '2-digit',

          month:
            '2-digit',

          hour:
            '2-digit',

          minute:
            '2-digit'
        }
      );
    }

    function formatAge(milliseconds) {
      const value =
        Number(milliseconds);

      if (
        !Number.isFinite(value) ||
        value <= 0
      ) {
        return 'Never';
      }

      const ageSeconds =
        Math.max(
          0,
          Math.floor(
            (
              Date.now() -
              value
            ) / 1000
          )
        );

      if (ageSeconds < 5) {
        return 'Just now';
      }

      if (ageSeconds < 60) {
        return `${ageSeconds} sec ago`;
      }

      const ageMinutes =
        Math.floor(
          ageSeconds / 60
        );

      if (ageMinutes < 60) {
        return `${ageMinutes} min ago`;
      }

      const ageHours =
        Math.floor(
          ageMinutes / 60
        );

      if (ageHours < 24) {
        return `${ageHours} h ago`;
      }

      const ageDays =
        Math.floor(
          ageHours / 24
        );

      return `${ageDays} d ago`;
    }

    function humanizeState(state) {
      if (!state) {
        return 'Unknown';
      }

      return String(state)
        .replaceAll('_', ' ')
        .replace(
          /\b\w/g,
          letter =>
            letter.toUpperCase()
        );
    }

    function resetManualOrderInputs() {
      document.querySelectorAll(
        '#boneless, ' +
        '#halfboneless, ' +
        '#wings8, ' +
        '#wings4, ' +
        '#beefbulgogi, ' +
        '#jeyuk, ' +
        '#bibimbap, ' +
        '#bulgogijapche, ' +
        '#japche'
      ).forEach(input => {
        input.value = 0;
      });

      document
        .querySelectorAll(
          '[id^="display-"]'
        )
        .forEach(display => {
          display.innerText = '0';
        });
    }

    // =========================
    // BOT STATUS
    // =========================

    function getBotHealth(status) {
      if (!status) {
        return {
          label:
            'Not configured',

          dotClass:
            'bg-gray-400',

          badgeClass:
            'bg-gray-100 text-gray-700',

          borderClass:
            'border-gray-200'
        };
      }

      const lastSeen =
        Number(status.lastSeen);

      const age =
        Date.now() -
        lastSeen;

      if (
        status.online === false ||
        !Number.isFinite(lastSeen) ||
        age > BOT_DELAYED_MAX_AGE_MS
      ) {
        return {
          label:
            'Offline',

          dotClass:
            'bg-red-500',

          badgeClass:
            'bg-red-100 text-red-800',

          borderClass:
            'border-red-200'
        };
      }

      if (
        status.state === 'error' ||
        age > BOT_ONLINE_MAX_AGE_MS
      ) {
        return {
          label:
            'Delayed',

          dotClass:
            'bg-yellow-500',

          badgeClass:
            'bg-yellow-100 text-yellow-800',

          borderClass:
            'border-yellow-200'
        };
      }

      return {
        label:
          'Online',

        dotClass:
          'bg-green-500',

        badgeClass:
          'bg-green-100 text-green-800',

        borderClass:
          'border-green-200'
      };
    }

    function renderBotStatuses(data) {
      botStatusContainer.innerHTML = '';

      for (
        const botName
        of BOT_DISPLAY_ORDER
      ) {
        const status =
          data?.[botName] ||
          null;

        const health =
          getBotHealth(status);

        const sourceLabel =
          getSourceLabel(botName);

        const lastSeenText =
          status
            ? formatAge(
                status.lastSeen
              )
            : 'No heartbeat';

        const stateText =
          status
            ? humanizeState(
                status.state
              )
            : 'Not configured';

        const lastOrderText =
          status?.lastOrderAt
            ? formatDateTime(
                status.lastOrderAt
              )
            : 'None recorded';

        const lastFeedText =
          status?.lastFeedAt
            ? formatAge(
                status.lastFeedAt
              )
            : 'Not observed yet';

        let extraInfo = '';

        if (
          botName === 'foodora' &&
          status
        ) {
          extraInfo = `
            <div class="flex justify-between gap-3 text-xs">
              <span class="text-gray-500">
                Last order feed
              </span>

              <span class="font-medium text-right">
                ${escapeHtml(
                  lastFeedText
                )}
              </span>
            </div>
          `;
        }

        if (
          botName === 'wolt' &&
          status
        ) {
          extraInfo = `
            <div class="flex justify-between gap-3 text-xs">
              <span class="text-gray-500">
                Last successful poll
              </span>

              <span class="font-medium text-right">
                ${escapeHtml(
                  formatAge(
                    status.lastSuccessfulPollAt
                  )
                )}
              </span>
            </div>
          `;
        }

        const errorBlock =
          status?.lastError
            ? `
              <div
                class="mt-3 rounded-lg bg-red-50 border border-red-200 p-2"
              >
                <div
                  class="text-xs font-bold text-red-800 mb-1"
                >
                  Latest error
                </div>

                <div
                  class="text-xs text-red-700 break-words"
                >
                  ${escapeHtml(
                    status.lastError
                  )}
                </div>
              </div>
            `
            : '';

        const card =
          document.createElement(
            'div'
          );

        card.className =
          `border ${health.borderClass} rounded-xl p-4 bg-gray-50`;

        card.innerHTML = `
          <div
            class="flex items-center justify-between gap-3 mb-3"
          >
            <div class="flex items-center gap-2">
              <span
                class="w-3 h-3 rounded-full ${health.dotClass}"
              ></span>

              <div class="font-bold text-lg">
                ${escapeHtml(
                  sourceLabel
                )}
              </div>
            </div>

            <span
              class="text-xs font-bold px-2 py-1 rounded-full ${health.badgeClass}"
            >
              ${escapeHtml(
                health.label
              )}
            </span>
          </div>

          <div class="space-y-2">
            <div class="flex justify-between gap-3 text-sm">
              <span class="text-gray-500">
                State
              </span>

              <span class="font-medium text-right">
                ${escapeHtml(
                  stateText
                )}
              </span>
            </div>

            <div class="flex justify-between gap-3 text-sm">
              <span class="text-gray-500">
                Last contact
              </span>

              <span class="font-medium text-right">
                ${escapeHtml(
                  lastSeenText
                )}
              </span>
            </div>

            <div class="flex justify-between gap-3 text-xs">
              <span class="text-gray-500">
                Last order
              </span>

              <span class="font-medium text-right">
                ${escapeHtml(
                  lastOrderText
                )}
              </span>
            </div>

            ${extraInfo}
          </div>

          ${errorBlock}
        `;

        botStatusContainer
          .appendChild(card);
      }
    }

    onValue(
      botStatusRef,

      snapshot => {
        latestBotStatusData =
          snapshot.val() || {};

        renderBotStatuses(
          latestBotStatusData
        );
      },

      error => {
        console.error(
          'Bot status listener error:',
          error
        );
      }
    );

    /*
     * Updates the displayed ages locally.
     * This does not write to Firebase.
     */
    setInterval(
      () => {
        renderBotStatuses(
          latestBotStatusData
        );
      },
      5000
    );

    // =========================
    // MANUAL ITEM BUTTONS
    // =========================

    document
      .querySelectorAll(
        '.plusBtn'
      )
      .forEach(btn => {
        btn.addEventListener(
          'click',
          () => {
            const target =
              btn.dataset.target;

            const input =
              document.getElementById(
                target
              );

            const display =
              document.getElementById(
                `display-${target}`
              );

            let value =
              parseInt(
                input.value,
                10
              ) || 0;

            value += 1;

            input.value = value;
            display.innerText = value;
          }
        );
      });

    document
      .querySelectorAll(
        '.minusBtn'
      )
      .forEach(btn => {
        btn.addEventListener(
          'click',
          () => {
            const target =
              btn.dataset.target;

            const input =
              document.getElementById(
                target
              );

            const display =
              document.getElementById(
                `display-${target}`
              );

            let value =
              parseInt(
                input.value,
                10
              ) || 0;

            value = Math.max(
              0,
              value - 1
            );

            input.value = value;
            display.innerText = value;
          }
        );
      });

    // =========================
    // ADD MANUAL ORDER
    // =========================

    addBtn.addEventListener(
      'click',
      async () => {
        const items = {
          'Boneless':
            parseInt(
              document
                .getElementById(
                  'boneless'
                )
                .value,
              10
            ) || 0,

          'Half Boneless':
            parseInt(
              document
                .getElementById(
                  'halfboneless'

                .value,
              10
            ) || 0,

          '8 Wings':
            parseInt(
              document
                .getElementById(
                  'wings8'
                )
                .value,
              10
            ) || 0,

          '4 Wings':
            parseInt(
              document
                .getElementById(
                  'wings4'
                )
                .value,
              10
            ) || 0,

          'Beef bulgogi':
            parseInt(
              document
                .getElementById(
                  'beefbulgogi'
                )
                .value,
              10
            ) || 0,

          'Jeyuk':
            parseInt(
              document
                .getElementById(
                  'jeyuk'
                )
                .value,
              10
            ) || 0,

          'Bibimbap':
            parseInt(
              document
                .getElementById(
                  'bibimbap'
                )
                .value,
              10
            ) || 0,

          'Bulgogi Japche':
            parseInt(
              document
                .getElementById(
                  'bulgogijapche'
                )
                .value,
              10
            ) || 0,

          'Japche':
            parseInt(
              document
                .getElementById(
                  'japche'
                )
                .value,
              10
            ) || 0
        };

        const totalQty =
          Object.values(items)
            .reduce(
              (sum, qty) =>
                sum + qty,
              0
            );

        if (totalQty === 0) {
          alert(
            'Add at least one item'
          );

          return;
        }

        const minutes =
          parseInt(
            document
              .getElementById(
                'timeInput'
              )
              .value,
            10
          );

        if (
          !minutes ||
          minutes < 1
        ) {
          alert(
            'Pickup time must be at least 1 minute'
          );

          return;
        }

        const now =
          Date.now();

        const readyAt =
          now +
          minutes *
          60 *
          1000;

        addBtn.disabled = true;
        addBtn.innerText =
          'Adding...';

        try {
          await push(
            ordersRef,
            {
              source:
                'manual',

              externalOrderId:
                null,

              orderNumber:
                null,

              kitchenStatus:
                'active',

              platformStatus:
                null,

              items,
              readyAt,

              createdAt:
                now,

              updatedAt:
                now,

              readyAtManuallyAdjusted:
                false
            }
          );

          resetManualOrderInputs();
        } catch (error) {
          console.error(
            'Could not add manual order:',
            error
          );

          alert(
            'Could not add order. Please try again.'
          );
        } finally {
          addBtn.disabled = false;
          addBtn.innerText =
            'Add Order';
        }
      }
    );

    // =========================
    // ADJUST ORDER TIME
    // =========================

    async function adjustOrderTime(
      orderId,
      minutes
    ) {
      if (
        !orderId ||
        !Number.isFinite(minutes)
      ) {
        return;
      }

      const orderRef =
        ref(
          db,
          `orders/${orderId}`
        );

      const result =
        await runTransaction(
          orderRef,

          currentOrder => {
            if (
              !currentOrder ||
              typeof currentOrder !==
                'object'
            ) {
              return currentOrder;
            }

            const currentReadyAt =
              Number(
                currentOrder.readyAt
              );

            const baseReadyAt =
              Number.isFinite(
                currentReadyAt
              )
                ? currentReadyAt
                : Date.now();

            return {
              ...currentOrder,

              readyAt:
                baseReadyAt +
                minutes *
                60 *
                1000,

              updatedAt:
                Date.now(),

              readyAtManuallyAdjusted:
                true,

              readyAtSource:
                'manual_adjustment'
            };
          }
        );

      if (!result.committed) {
        throw new Error(
          'Firebase transaction was not committed'
        );
      }
    }

    // =========================
    // LIVE ORDER UPDATES
    // =========================

    onValue(
      ordersRef,

      snapshot => {
        const data =
          snapshot.val() || {};

        renderOrders(data);
        renderSummary(data);
      },

      error => {
        console.error(
          'Firebase order listener error:',
          error
        );
      }
    );

    // =========================
    // RENDER ORDERS
    // =========================

    function renderOrders(data) {
      ordersContainer.innerHTML = '';

      const entries =
        Object.entries(data)
          .filter(
            ([_, order]) =>
              order &&
              typeof order ===
                'object'
          )
          .sort(
            (a, b) =>
              Number(
                a[1].readyAt || 0
              ) -
              Number(
                b[1].readyAt || 0
              )
          );

      if (
        entries.length === 0
      ) {
        ordersContainer.innerHTML = `
          <div
            class="text-center text-gray-500 py-8"
          >
            No active orders
          </div>
        `;

        return;
      }

      for (
        const [id, order]
        of entries
      ) {
        const source =
          getOrderSource(order);

        const sourceLabel =
          getSourceLabel(source);

        const sourceBadgeClass =
          getSourceBadgeClass(
            source
          );

        const orderNumber =
          getOrderNumber(order);

        const platformStatus =
          order.platformStatus ||
          null;

        const manuallyAdjusted =
          order.readyAtManuallyAdjusted ===
          true;

        const itemLines =
          Object.entries(
            order.items || {}
          )
            .filter(
              ([_, qty]) =>
                Number(qty) > 0
            )
            .map(
              ([name, qty]) => `
                <div
                  class="flex justify-between border-b py-1"
                >
                  <span>
                    ${escapeHtml(name)}
                  </span>

                  <span class="font-bold">
                    ${Number(qty)}
                  </span>
                </div>
              `
            )
            .join('');

        const orderTitle =
          orderNumber
            ? (
                `${escapeHtml(
                  sourceLabel
                )} #${escapeHtml(
                  orderNumber
                )}`
              )
            : escapeHtml(
                sourceLabel
              );

        const statusLine =
          platformStatus
            ? `
              <div
                class="text-xs text-gray-500 mt-1"
              >
                Platform status:
                ${escapeHtml(
                  platformStatus
                )}
              </div>
            `
            : '';

        const adjustedLine =
          manuallyAdjusted
            ? `
              <div
                class="text-xs text-orange-700 mt-1"
              >
                Pickup time manually adjusted
              </div>
            `
            : '';

        const card =
          document.createElement(
            'div'
          );

        card.className =
          'bg-gray-50 border rounded-xl p-4';

        card.innerHTML = `
          <div
            class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4"
          >
            <div class="flex-1">
              <div
                class="flex flex-wrap items-center gap-2 mb-2"
              >
                <div class="text-lg font-bold">
                  ${orderTitle}
                </div>

                <span
                  class="text-xs font-bold px-2 py-1 rounded-full ${sourceBadgeClass}"
                >
                  ${escapeHtml(
                    sourceLabel
                  )}
                </span>
              </div>

              <div
                class="text-sm text-gray-500 mb-1"
              >
                Ready at
                ${escapeHtml(
                  formatReadyTime(
                    order.readyAt
                  )
                )}
              </div>

              ${statusLine}
              ${adjustedLine}

              <div class="mt-3">
                ${
                  itemLines ||
                  `
                    <div class="text-gray-500">
                      No mapped kitchen items
                    </div>
                  `
                }
              </div>
            </div>

            <div class="text-center min-w-[220px]">
              <div
                class="text-sm text-gray-500 mb-2"
              >
                Pickup In
              </div>

              <div
                class="flex items-center justify-center gap-3"
              >
                <button
                  class="adjustTimeBtn bg-green-700 text-white w-10 h-10 rounded-lg text-xl font-bold disabled:opacity-50"
                  data-id="${escapeHtml(id)}"
                  data-minutes="-1"
                  title="Reduce by 1 minute"
                  aria-label="Reduce pickup time by one minute"
                >
                  −
                </button>

                <div
                  class="orderTimer text-3xl font-bold min-w-[110px]"
                  data-ready-at="${
                    Number(
                      order.readyAt
                    ) || 0
                  }"
                ></div>

                <button
                  class="adjustTimeBtn bg-orange-500 text-white w-10 h-10 rounded-lg text-xl font-bold disabled:opacity-50"
                  data-id="${escapeHtml(id)}"
                  data-minutes="1"
                  title="Increase by 1 minute"
                  aria-label="Increase pickup time by one minute"
                >
                  +
                </button>
              </div>

              <div
                class="text-xs text-gray-500 mt-2"
              >
                Adjust by 1 minute
              </div>
            </div>

            <button
              class="deleteBtn bg-green-600 text-white px-4 py-2 rounded font-bold disabled:opacity-50"
              data-id="${escapeHtml(id)}"
            >
              Completed
            </button>
          </div>
        `;

        ordersContainer
          .appendChild(card);
      }

      // COMPLETE ORDER BUTTONS

      document
        .querySelectorAll(
          '.deleteBtn'
        )
        .forEach(btn => {
          btn.addEventListener(
            'click',
            async () => {
              const id =
                btn.dataset.id;

              btn.disabled = true;

              btn.innerText =
                'Completing...';

              try {
                await remove(
                  ref(
                    db,
                    `orders/${id}`
                  )
                );
              } catch (error) {
                console.error(
                  'Could not complete order:',
                  error
                );

                alert(
                  'Could not complete order. Please try again.'
                );

                btn.disabled = false;

                btn.innerText =
                  'Completed';
              }
            }
          );
        });

      // ADJUST TIME BUTTONS

      document
        .querySelectorAll(
          '.adjustTimeBtn'
        )
        .forEach(btn => {
          btn.addEventListener(
            'click',
            async () => {
              const orderId =
                btn.dataset.id;

              const minutes =
                Number(
                  btn.dataset.minutes
                );

              if (
                !orderId ||
                !Number.isFinite(minutes)
              ) {
                return;
              }

              btn.disabled = true;

              try {
                await adjustOrderTime(
                  orderId,
                  minutes
                );
              } catch (error) {
                console.error(
                  'Could not adjust pickup time:',
                  error
                );

                alert(
                  'Could not change pickup time. Please try again.'
                );

                btn.disabled = false;
              }
            }
          );
        });

      updateAllCountdowns();
    }

    // =========================
    // GLOBAL COUNTDOWN TIMER
    // =========================

    function updateAllCountdowns() {
      document
        .querySelectorAll(
          '.orderTimer'
        )
        .forEach(timer => {
          const readyAt =
            Number(
              timer.dataset.readyAt
            );

          if (
            !Number.isFinite(readyAt) ||
            readyAt <= 0
          ) {
            timer.innerHTML =
              '<span class="text-gray-500">--</span>';

            return;
          }

          const diff =
            readyAt -
            Date.now();

          if (diff <= 0) {
            timer.innerHTML =
              '<span class="text-red-600">READY</span>';

            return;
          }

          const minutes =
            Math.floor(
              diff /
              1000 /
              60
            );

          const seconds =
            Math.floor(
              (
                diff /
                1000
              ) % 60
            );

          timer.innerText =
            `${minutes}m ${seconds}s`;
        });
    }

    setInterval(
      updateAllCountdowns,
      1000
    );

    // =========================
    // PRODUCTION SUMMARY
    // =========================

    function renderSummary(data) {
      summaryContainer.innerHTML = '';

      const totals =
        Object.fromEntries(
          KITCHEN_ITEMS.map(
            item => [
              item,
              0
            ]
          )
        );

      const next15 =
        Date.now() +
        15 *
        60 *
        1000;

      Object.values(data)
        .forEach(order => {
          if (
            !order ||
            typeof order !==
              'object'
          ) {
            return;
          }

          const readyAt =
            Number(
              order.readyAt
            );

          if (
            !Number.isFinite(readyAt) ||
            readyAt > next15
          ) {
            return;
          }

          Object.entries(
            order.items || {}
          ).forEach(
            ([item, qty]) => {
              if (
                !(item in totals)
              ) {
                return;
              }

              totals[item] +=
                Number(qty) || 0;
            }
          );
        });

      Object.entries(totals)
        .forEach(
          ([item, qty]) => {
            const card =
              document.createElement(
                'div'
              );

            card.className =
              'bg-orange-100 rounded-xl p-3 text-center';

            card.innerHTML = `
              <div
                class="font-bold text-sm mb-1"
              >
                ${escapeHtml(item)}
              </div>

              <div class="text-3xl font-bold">
                ${qty}
              </div>
            `;

            summaryContainer
              .appendChild(card);
          }
        );
    }
  </script>
</body>
</html>
